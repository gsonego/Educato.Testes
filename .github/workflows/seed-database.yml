name: Seed do banco de dados de testes

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL base da API de testes (ex.: https://seu-servidor/educato/teste/api). Deixe vazio para pular a geração de tarjetas.'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - 'seed/**'
      - '.github/workflows/seed-database.yml'
  schedule:
    # Todo domingo às 03:00 UTC (00:00 no horário de Brasília)
    - cron: '0 3 * * 0'

# Evita dois runs sobrescrevendo o banco ao mesmo tempo (agendamento + PRs + manual).
concurrency:
  group: seed-database
  cancel-in-progress: false

jobs:
  # Etapa 1: limpa e popula o banco de testes (cenário fixo de escolas/turmas/alunos).
  seed-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: seed/package-lock.json

      - name: Instalar dependências
        working-directory: seed
        run: npm ci

      - name: Executar seed
        working-directory: seed
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: node seed.js

  # Etapa 2: gera a malha de tarjetas via API de testes (exige o banco seedado).
  gerar-tarjetas:
    needs: seed-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: seed/package-lock.json

      - name: Instalar dependências
        working-directory: seed
        run: npm ci

      - name: Gerar tarjetas via API
        working-directory: seed
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
        # Sem API_BASE_URL o passo é pulado (job verde sem gerar tarjetas).
        if: env.API_BASE_URL != ''
        run: node seed-tarjetas.js

  # Etapa 3: preenche notas/faltas via API (exige tarjetas geradas: sem tarjetas, sem nota).
  preencher-notas:
    needs: gerar-tarjetas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: seed/package-lock.json

      - name: Instalar dependências
        working-directory: seed
        run: npm ci

      - name: Preencher notas via API
        working-directory: seed
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
        # Sem API_BASE_URL o passo é pulado; o script ainda confere se há tarjetas no banco.
        if: env.API_BASE_URL != ''
        run: node seed-notas.js